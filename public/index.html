<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>映界视频 · 发现好内容</title>
<style>
:root{--bg:#0d1017;--panel:#171c27;--panel2:#202737;--text:#f4f6fb;--muted:#9aa5b7;--line:#2a3343;--accent:#8b7cff;--accent2:#b2a9ff;--green:#3ecf9b;--red:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 max(22px,calc((100vw - 1380px)/2));position:sticky;top:0;background:#0d1017ed;backdrop-filter:blur(16px);z-index:5}.brand{font-size:21px;font-weight:850;letter-spacing:-.7px;white-space:nowrap}.brand i{font-style:normal;color:var(--accent2)}.search{flex:1;max-width:570px;position:relative}.search input{width:100%;height:42px;background:#1a202c;border:1px solid var(--line);border-radius:12px;padding:0 16px;color:white;outline:none}.search input:focus{border-color:var(--accent)}.header-actions{margin-left:auto;display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:#242b3a;color:#e8eaff;border:1px solid #343d50}.container{max-width:1380px;margin:auto;padding:30px 22px 70px}.hero{padding:28px 30px;border:1px solid #34304f;border-radius:22px;background:radial-gradient(ellipse at 80% 20%,#5446a044,transparent 42%),linear-gradient(120deg,#1b2030,#171827);margin-bottom:26px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 10px;letter-spacing:-1px}.hero p{margin:0;color:#b3bbcc}.hero-mark{font-size:62px;opacity:.8;padding:0 24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 16px}.section-head h2{font-size:19px;margin:0}.count{font-size:12px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 15px;background:transparent;color:#b7c0d0;white-space:nowrap}.chip.active{background:#302b52;border-color:#7163cf;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.video-card{min-width:0;cursor:pointer}.thumb{aspect-ratio:16/9;border-radius:15px;background:linear-gradient(135deg,#252d41,#151a25);overflow:hidden;position:relative;border:1px solid #252d3b}.thumb video{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;display:grid;place-items:center;background:#0002;opacity:0;transition:.2s}.video-card:hover .play{opacity:1}.play span{width:48px;height:48px;border-radius:50%;background:#ffffffdf;color:#171827;display:grid;place-items:center;font-size:20px;padding-left:3px}.video-info{padding:11px 2px}.video-title{font-weight:750;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.video-meta{font-size:12px;color:var(--muted);margin-top:6px}.tag{display:inline-block;font-size:11px;color:#c7c0ff;background:#312d50;padding:3px 8px;border-radius:6px;margin-right:7px}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed #394254;border-radius:16px;grid-column:1/-1}.empty b{display:block;color:#e6e9f2;font-size:17px;margin-bottom:6px}.modal{position:fixed;inset:0;background:#05070cbb;backdrop-filter:blur(7px);z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{width:min(580px,100%);max-height:90vh;overflow:auto;background:#171d29;border:1px solid #394254;border-radius:20px;padding:24px;box-shadow:0 25px 90px #0009}.dialog h2{margin:0 0 18px;font-size:21px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#b9c2d2;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #394254;background:#101620;color:white;border-radius:10px;padding:12px;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.hint{font-size:12px;color:var(--muted);margin-top:6px}.progress{height:5px;background:#2c3443;border-radius:9px;overflow:hidden;margin-top:12px}.progress i{display:block;width:0;height:100%;background:var(--green)}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.admin-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.admin-row video{width:140px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#080b10}.admin-row .details{flex:1;min-width:0}.admin-row h3{font-size:14px;margin:0 0 5px}.admin-row p{font-size:12px;color:var(--muted);margin:0}.status{font-size:11px;color:#ffd58c}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f3f3f7;color:#161925;padding:11px 18px;border-radius:11px;font-weight:700;z-index:30;box-shadow:0 8px 30px #0007}.player{width:min(980px,100%)}.player video{width:100%;max-height:65vh;background:#000;border-radius:12px}.player h2{margin:14px 0 4px}.player p{color:var(--muted);margin:0}.close{float:right;background:transparent;border:0;color:#cbd2df;font-size:25px;padding:0 5px}.foot{text-align:center;color:#687386;font-size:12px;margin-top:55px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.header{height:auto;min-height:65px;flex-wrap:wrap;padding:12px 15px;gap:12px}.brand{font-size:19px}.search{order:3;flex-basis:100%;max-width:none}.header-actions{gap:7px}.btn{padding:9px 11px;font-size:13px}.container{padding:18px 15px 50px}.hero{padding:23px 20px}.hero-mark{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.video-title{font-size:13px}.thumb{border-radius:11px}.admin-row video{width:100px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.video-card{display:grid;grid-template-columns:42% 1fr;gap:9px}.video-info{padding:2px}.admin-row video{width:82px}}
</style></head><body>
<header class="header"><div class="brand">映界 <i>VIDEO</i></div><div class="search"><input id="search" placeholder="搜索视频标题、简介…"></div><div class="header-actions"><button class="btn secondary" id="adminBtn">管理审核</button><button class="btn primary" id="uploadBtn">＋ 上传视频</button></div></header>
<main class="container"><section class="hero"><div><h1>好内容，值得被看见。</h1><p>发现灵感、分享热爱。上传你的视频，让更多人看见你的世界。</p></div><div class="hero-mark">▶</div></section>
<div class="section-head"><h2>探索视频</h2><span class="count" id="count">加载中…</span></div><div class="chips" id="categories"></div><section class="grid" id="videos"><div class="empty"><b>正在加载视频</b>请稍候…</div></section>
<div class="foot">映界视频 · 尊重原创，文明分享 · 上传内容经管理员审核后公开</div></main>
<div class="modal" id="uploadModal"><div class="dialog"><button class="close" data-close="uploadModal">×</button><h2>上传你的视频</h2><form id="uploadForm"><div class="field"><label>视频文件</label><input type="file" id="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v" required><div class="hint">支持 MP4 / WebM / MOV，单个文件最大 300MB</div></div><div class="field"><label>视频标题</label><input id="title" maxlength="80" required placeholder="给你的视频起个名字"></div><div class="field"><label>视频简介</label><textarea id="description" maxlength="500" placeholder="介绍一下视频内容（选填）"></textarea></div><div class="field"><label>选择分类</label><select id="category"></select></div><div id="uploadProgress" class="hidden"><div class="hint" id="progressText">正在上传…</div><div class="progress"><i id="progressBar"></i></div></div><div class="dialog-actions"><button type="button" class="btn secondary" data-close="uploadModal">取消</button><button class="btn primary" id="submitUpload">提交审核</button></div></form></div></div>
<div class="modal" id="adminModal"><div class="dialog"><button class="close" data-close="adminModal">×</button><h2>管理员审核中心</h2><div id="adminContent"><form id="loginForm"><div class="field"><label>管理员密码</label><input type="password" id="adminPassword" required placeholder="输入管理员密码"></div><div class="dialog-actions"><button class="btn primary">登录后台</button></div></form></div></div></div>
<div class="modal" id="playerModal"><div class="dialog player"><button class="close" data-close="playerModal">×</button><video id="player" controls playsinline></video><h2 id="playerTitle"></h2><p id="playerDescription"></p></div></div><div id="toast" class="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);let active='全部',all=[];
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2800)}
function modal(id,on=true){$(id).classList.toggle('show',on)}
async function api(url,opts={}){const r=await fetch(url,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'请求失败');return d}
async function init(){try{const cats=await api('/api/categories');$('categories').innerHTML=['全部',...cats].map(c=>'<button class="chip '+(c==='全部'?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');$('category').innerHTML=cats.map(c=>'<option>'+esc(c)+'</option>').join('');await loadVideos()}catch(e){$('videos').innerHTML='<div class="empty"><b>暂时无法连接服务</b>'+esc(e.message)+'</div>'}}
async function loadVideos(){try{all=await api('/api/videos'+(active!=='全部'?'?category='+encodeURIComponent(active):''));draw()}catch(e){$('videos').innerHTML='<div class="empty"><b>加载失败</b>'+esc(e.message)+'</div>'}}
function draw(){const q=$('search').value.trim().toLowerCase(),rows=all.filter(v=>(v.title+' '+v.description).toLowerCase().includes(q));$('count').textContent=rows.length+' 个视频';$('videos').innerHTML=rows.length?rows.map(v=>'<article class="video-card" data-play="'+esc(v.id)+'"><div class="thumb"><video src="/uploads/'+encodeURIComponent(v.filename)+'#t=1" preload="metadata" muted playsinline></video><div class="play"><span>▶</span></div></div><div class="video-info"><div class="video-title">'+esc(v.title)+'</div><div class="video-meta"><span class="tag">'+esc(v.category)+'</span>'+new Date(v.createdAt).toLocaleDateString('zh-CN')+'</div></div></article>').join(''):'<div class="empty"><b>这里还没有视频</b>换个分类看看，或者上传第一个视频。</div>'}
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));loadVideos()});
$('search').addEventListener('input',draw);$('uploadBtn').onclick=()=>modal('uploadModal');$('adminBtn').onclick=()=>modal('adminModal');
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)modal(c.dataset.close,false);const v=e.target.closest('[data-play]');if(v){const item=all.find(x=>x.id===v.dataset.play);if(item){$('player').src='/uploads/'+encodeURIComponent(item.filename);$('playerTitle').textContent=item.title;$('playerDescription').textContent=item.description||'';modal('playerModal')}}});
$('uploadForm').addEventListener('submit',e=>{e.preventDefault();const f=$('file').files[0];if(!f)return;if(f.size>300*1024*1024){toast('视频不能超过 300MB');return}const data=new FormData();data.append('video',f);data.append('title',$('title').value);data.append('description',$('description').value);data.append('category',$('category').value);const xhr=new XMLHttpRequest();xhr.open('POST','/api/upload');$('submitUpload').disabled=true;$('submitUpload').textContent='上传中…';$('uploadProgress').classList.remove('hidden');xhr.upload.onprogress=e=>{if(e.lengthComputable){const n=Math.round(e.loaded/e.total*100);$('progressBar').style.width=n+'%';$('progressText').textContent='上传进度 '+n+'%'}};xhr.onload=()=>{let d={};try{d=JSON.parse(xhr.responseText)}catch{}$('submitUpload').disabled=false;$('submitUpload').textContent='提交审核';if(xhr.status>=200&&xhr.status<300){modal('uploadModal',false);$('uploadForm').reset();$('uploadProgress').classList.add('hidden');toast('上传成功！审核通过后就会公开显示。')}else toast(d.error||'上传失败')};xhr.onerror=()=>{ $('submitUpload').disabled=false;$('submitUpload').textContent='提交审核';toast('网络错误，上传未完成')};xhr.send(data)});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('adminPassword').value})});await adminPanel()}catch(e){toast(e.message)}});
async function adminPanel(){try{const rows=await api('/api/admin/pending');$('adminContent').innerHTML='<div class="count">待审核 '+rows.length+' 条</div>'+(rows.length?rows.map(v=>'<div class="admin-row"><video src="/uploads/'+encodeURIComponent(v.filename)+'" controls preload="metadata"></video><div class="details"><h3>'+esc(v.title)+'</h3><p>'+esc(v.category)+' · '+(v.size/1024/1024).toFixed(1)+'MB</p><p>'+esc(v.description||'无简介')+'</p><div style="display:flex;gap:7px;margin-top:9px"><button class="btn primary" data-review="approved" data-id="'+esc(v.id)+'">通过发布</button><button class="btn secondary" data-review="rejected" data-id="'+esc(v.id)+'">驳回</button><button class="btn secondary" data-delete="'+esc(v.id)+'">删除</button></div></div></div>').join(''):'<div class="empty"><b>暂无待审核视频</b>新上传的视频会出现在这里。</div>')+'<div class="dialog-actions"><button class="btn secondary" id="logout">退出管理</button><button class="btn primary" id="refresh">刷新列表</button></div>';$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});$('adminContent').innerHTML=$('loginForm').outerHTML;toast('已退出')};$('refresh').onclick=adminPanel}catch(e){$('adminContent').innerHTML='<form id="loginForm"><div class="field"><label>管理员密码</label><input type="password" id="adminPassword" required></div><div class="dialog-actions"><button class="btn primary">登录后台</button></div></form>';toast(e.message);$('loginForm').onsubmit=async ev=>{ev.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('adminPassword').value})});adminPanel()}catch(err){toast(err.message)}}}}
$('adminContent').addEventListener('click',async e=>{const b=e.target.closest('[data-review],[data-delete]');if(!b)return;try{if(b.dataset.review){await api('/api/admin/videos/'+b.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:b.dataset.review})});toast(b.dataset.review==='approved'?'已通过，视频公开发布':'已驳回')}else if(confirm('确定永久删除这个视频吗？')){await api('/api/admin/videos/'+b.dataset.delete,{method:'DELETE'});toast('视频已删除')}adminPanel();loadVideos()}catch(e){toast(e.message)}});
init();
</script></body></html>
