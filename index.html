<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>星学伴 Pro · 学习工作台</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182235;--muted:#7d8798;--line:#e8edf4;--blue:#536dfe;--blue2:#edf0ff;--green:#18a879;--orange:#f59e0b;--shadow:0 10px 35px #18294b0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:240px;background:#111a2b;color:#dce4f4;padding:28px 18px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;margin:0 8px 38px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7587ff,#4a5bea);display:grid;place-items:center;color:white;font-size:20px}.navlabel{font-size:11px;color:#78869e;letter-spacing:1.4px;margin:0 12px 12px}.nav button{width:100%;border:0;background:transparent;color:#aeb9cc;text-align:left;padding:12px 13px;border-radius:10px;margin:3px 0;cursor:pointer;font:inherit}.nav button.active,.nav button:hover{background:#26334a;color:#fff}.nav button span{display:inline-block;width:26px}.sidefoot{margin-top:auto;color:#7d8ba3;font-size:12px;padding:12px}.main{flex:1;min-width:0;padding:32px clamp(18px,4vw,54px);max-width:1500px;margin:0 auto;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:1px}.top h1{font-size:27px;margin:4px 0 0}.date{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;font-size:14px}.primary{background:var(--blue);color:#fff;box-shadow:0 5px 14px #536dfe33}.soft{background:var(--blue2);color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stathead{color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.stat strong{display:block;font-size:27px;margin-top:8px}.stat small{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.85fr);gap:18px}.card{padding:21px;margin-bottom:18px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.cardhead h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:12px}.course{padding:15px 0;border-top:1px solid var(--line)}.course:first-of-type{border-top:0}.course-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.course-name{font-weight:700}.course-meta{font-size:12px;color:var(--muted);margin-top:3px}.progress{height:7px;background:#edf0f6;border-radius:20px;overflow:hidden;margin:12px 0 7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#536dfe,#8d9bff);border-radius:20px}.course-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.mini-actions{display:flex;gap:7px}.mini{border:1px solid var(--line);background:white;border-radius:8px;padding:5px 9px;cursor:pointer;color:#526078}.mini:hover{border-color:var(--blue);color:var(--blue)}.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.task input{margin-top:5px;accent-color:var(--blue)}.task.done .tasktitle{text-decoration:line-through;color:#a0a8b6}.tasktitle{font-weight:600}.taskmeta{font-size:12px;color:var(--muted)}.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#fff5df;color:#b77908;white-space:nowrap}.tag.done{background:#e7f8f1;color:#15976b}.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:14px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;cursor:pointer;font-weight:650;color:var(--ink)}.quick button:hover{border-color:#aeb8ff;background:#fafaff}.quick small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.view{display:none}.view.active{display:block}.hidden{display:none!important}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100% - 28px));box-shadow:0 25px 80px #10182744}dialog::backdrop{background:#10182788;backdrop-filter:blur(3px)}.modal{padding:24px}.modal h2{margin:0 0 18px;font-size:19px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5ef;border-radius:10px;padding:11px 12px;font:inherit;outline:none;background:white}.field input:focus,.field select:focus{border-color:var(--blue)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172238;color:#fff;padding:11px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:5;font-size:13px}
@media(max-width:900px){.side{width:205px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:620px){.app{display:block}.side{width:100%;padding:13px 15px;display:block}.brand{margin:0 4px 10px}.nav{display:flex;overflow:auto;gap:4px}.navlabel,.sidefoot{display:none}.nav button{white-space:nowrap;width:auto;padding:9px 11px;margin:0}.nav button span{width:auto;margin-right:5px}.main{padding:22px 15px}.top{align-items:flex-start}.top h1{font-size:23px}.date{display:none}.actions .btn{padding:10px}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.card{padding:16px}}
</style></head><body><div class="app">
<aside class="side"><div class="brand"><div class="logo">✦</div>星学伴 <span style="color:#8292ff">Pro</span></div><div class="navlabel">工作空间</div><nav class="nav"><button class="active" data-view="home"><span>⌂</span>学习总览</button><button data-view="courses"><span>▤</span>我的课程</button><button data-view="tasks"><span>✓</span>学习任务</button><button data-view="statsview"><span>◷</span>学习统计</button></nav><div class="sidefoot">让每一次努力，都看得见。<br>本地数据保存在当前设备</div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">YOUR STUDY COMPANION</div><h1 id="pageTitle">学习总览</h1><div class="date" id="today"></div></div><div class="actions"><button class="btn soft" id="addTaskTop">＋ 添加任务</button><button class="btn primary" id="addCourseTop">＋ 添加课程</button></div></header>
<section class="view active" id="home"><div class="stats"><div class="stat"><div class="stathead">我的课程 <span>▤</span></div><strong id="sCourses">0</strong><small>正在管理的课程</small></div><div class="stat"><div class="stathead">整体进度 <span>◉</span></div><strong id="sProgress">0%</strong><small>所有课程平均进度</small></div><div class="stat"><div class="stathead">待完成任务 <span>◷</span></div><strong id="sPending">0</strong><small>别忘了今天的计划</small></div><div class="stat"><div class="stathead">已完成任务 <span>✓</span></div><strong id="sDone">0</strong><small>每一步都算数</small></div></div>
<div class="layout"><div><section class="card"><div class="cardhead"><h2>课程进度</h2><button class="btn soft" id="goCourses">管理课程</button></div><div id="homeCourses"></div></section><section class="card"><div class="cardhead"><h2>最近任务</h2><button class="btn soft" id="goTasks">全部任务</button></div><div id="homeTasks"></div></section></div><div><section class="card"><div class="cardhead"><h2>快捷操作</h2></div><div class="quick"><button id="quickCourse">＋ 新建课程<small>记录课程与进度</small></button><button id="quickTask">✓ 新建任务<small>安排学习计划</small></button><button id="quickStats">◷ 学习统计<small>查看整体情况</small></button><button id="exportData">↓ 导出数据<small>备份你的学习记录</small></button></div></section><section class="card"><div class="cardhead"><h2>今日寄语</h2></div><div style="font-size:17px;font-weight:650;line-height:1.7">不必追赶别人，<br>只要比昨天的自己更进一步。</div><p class="muted">把大目标拆成今天能完成的小事。</p></section></div></div></section>
<section class="view" id="courses"><section class="card"><div class="cardhead"><h2>我的全部课程</h2><button class="btn primary" id="addCoursePage">＋ 添加课程</button></div><div id="allCourses"></div></section></section>
<section class="view" id="tasks"><section class="card"><div class="cardhead"><h2>学习任务清单</h2><button class="btn primary" id="addTaskPage">＋ 添加任务</button></div><div id="allTasks"></div></section></section>
<section class="view" id="statsview"><div class="stats"><div class="stat"><div class="stathead">课程总数</div><strong id="stCourses">0</strong></div><div class="stat"><div class="stathead">平均完成度</div><strong id="stProgress">0%</strong></div><div class="stat"><div class="stathead">任务完成率</div><strong id="stRate">0%</strong></div><div class="stat"><div class="stathead">累计完成任务</div><strong id="stDone">0</strong></div></div><section class="card"><h2 style="font-size:16px">课程进度一览</h2><div id="statsCourses"></div></section></section>
</main></div>
<dialog id="courseDialog"><form class="modal" id="courseForm"><h2 id="courseModalTitle">添加课程</h2><input type="hidden" id="courseId"><div class="field"><label>课程名称</label><input id="courseName" required maxlength="60" placeholder="例如：大学英语（四）"></div><div class="field"><label>课程平台 / 教师（选填）</label><input id="courseTeacher" maxlength="60" placeholder="例如：学习通 · 王老师"></div><div class="field"><label>当前学习进度（0-100）</label><input id="courseProgress" type="number" min="0" max="100" value="0" required></div><div class="modal-actions"><button type="button" class="btn soft" data-close="courseDialog">取消</button><button class="btn primary">保存课程</button></div></form></dialog>
<dialog id="taskDialog"><form class="modal" id="taskForm"><h2>添加学习任务</h2><div class="field"><label>任务内容</label><input id="taskName" required maxlength="100" placeholder="例如：完成第三章课后练习"></div><div class="field"><label>关联课程</label><select id="taskCourse"><option value="">暂不关联课程</option></select></div><div class="field"><label>截止日期（选填）</label><input id="taskDue" type="date"></div><div class="modal-actions"><button type="button" class="btn soft" data-close="taskDialog">取消</button><button class="btn primary">保存任务</button></div></form></dialog>
<div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let courses=load('xing_courses',[]),tasks=load('xing_tasks',[]);
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(){localStorage.setItem('xing_courses',JSON.stringify(courses));localStorage.setItem('xing_tasks',JSON.stringify(tasks));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function avg(){return courses.length?Math.round(courses.reduce((a,c)=>a+c.progress,0)/courses.length):0}
function courseHTML(c){return '<div class="course"><div class="course-top"><div><div class="course-name">'+esc(c.name)+'</div><div class="course-meta">'+esc(c.teacher||'未填写平台 / 教师')+'</div></div><div class="mini-actions"><button class="mini" data-edit="'+c.id+'">编辑</button><button class="mini" data-delcourse="'+c.id+'">删除</button></div></div><div class="progress"><i style="width:'+c.progress+'%"></i></div><div class="course-foot"><span>学习进度</span><span><b>'+c.progress+'%</b></span></div></div>'}
function taskHTML(t){let c=courses.find(x=>x.id===t.courseId);return '<div class="task '+(t.done?'done':'')+'"><input type="checkbox" data-toggle="'+t.id+'" '+(t.done?'checked':'')+'><div style="flex:1"><div class="tasktitle">'+esc(t.name)+'</div><div class="taskmeta">'+(c?esc(c.name)+' · ':'')+(t.due?'截止 '+esc(t.due):'未设置截止日期')+'</div></div><span class="tag '+(t.done?'done':'')+'">'+(t.done?'已完成':'待完成')+'</span><button class="mini" data-deltask="'+t.id+'">删除</button></div>'}
function empty(s){return '<div class="empty">'+s+'</div>'}
function render(){let pending=tasks.filter(t=>!t.done).length,done=tasks.filter(t=>t.done).length;
$('sCourses').textContent=courses.length;$('sProgress').textContent=avg()+'%';$('sPending').textContent=pending;$('sDone').textContent=done;
$('homeCourses').innerHTML=courses.length?courses.slice(0,4).map(courseHTML).join(''):empty('还没有课程，点击右上角「添加课程」开始吧。');
$('allCourses').innerHTML=courses.length?courses.map(courseHTML).join(''):empty('暂无课程，添加第一门课程吧。');
let recent=[...tasks].sort((a,b)=>(a.done?1:0)-(b.done?1:0)).slice(0,5);
$('homeTasks').innerHTML=recent.length?recent.map(taskHTML).join(''):empty('暂无任务，给自己安排一个小目标吧。');
$('allTasks').innerHTML=tasks.length?[...tasks].sort((a,b)=>(a.done?1:0)-(b.done?1:0)).map(taskHTML).join(''):empty('暂无学习任务。');
$('stCourses').textContent=courses.length;$('stProgress').textContent=avg()+'%';$('stDone').textContent=done;$('stRate').textContent=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
$('statsCourses').innerHTML=courses.length?courses.map(c=>'<div class="course"><div class="course-top"><b>'+esc(c.name)+'</b><b>'+c.progress+'%</b></div><div class="progress"><i style="width:'+c.progress+'%"></i></div></div>').join(''):empty('添加课程后即可查看统计。');
$('taskCourse').innerHTML='<option value="">暂不关联课程</option>'+courses.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('pageTitle').textContent=({home:'学习总览',courses:'我的课程',tasks:'学习任务',statsview:'学习统计'})[v]}
function openCourse(c){$('courseForm').reset();$('courseId').value=c?.id||'';$('courseModalTitle').textContent=c?'编辑课程':'添加课程';$('courseName').value=c?.name||'';$('courseTeacher').value=c?.teacher||'';$('courseProgress').value=c?.progress??0;$('courseDialog').showModal()}
function openTask(){$('taskForm').reset();$('taskDialog').showModal()}
$('courseForm').addEventListener('submit',e=>{e.preventDefault();let cid=$('courseId').value,obj={id:cid||id(),name:$('courseName').value.trim(),teacher:$('courseTeacher').value.trim(),progress:Math.max(0,Math.min(100,Number($('courseProgress').value)||0))};if(!obj.name)return;if(cid)courses=courses.map(c=>c.id===cid?obj:c);else courses.push(obj);$('courseDialog').close();save();toast(cid?'课程已更新':'课程已添加')});
$('taskForm').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:id(),name:$('taskName').value.trim(),courseId:$('taskCourse').value,due:$('taskDue').value,done:false});$('taskDialog').close();save();toast('任务已添加')});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view)showView(b.dataset.view);if(b.dataset.edit)openCourse(courses.find(c=>c.id===b.dataset.edit));if(b.dataset.delcourse){let c=courses.find(c=>c.id===b.dataset.delcourse);if(c&&confirm('确定删除课程「'+c.name+'」吗？关联任务不会删除。')){courses=courses.filter(x=>x.id!==c.id);save();toast('课程已删除')}}if(b.dataset.deltask){tasks=tasks.filter(t=>t.id!==b.dataset.deltask);save();toast('任务已删除')}if(b.dataset.close)$(b.dataset.close).close()});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){let t=tasks.find(x=>x.id===e.target.dataset.toggle);if(t){t.done=e.target.checked;save();toast(t.done?'任务完成，做得好！':'已恢复为待完成')}}});
['addCourseTop','addCoursePage','quickCourse'].forEach(x=>$(x).onclick=()=>openCourse());['addTaskTop','addTaskPage','quickTask'].forEach(x=>$(x).onclick=openTask);$('goCourses').onclick=()=>showView('courses');$('goTasks').onclick=()=>showView('tasks');$('quickStats').onclick=()=>showView('statsview');
$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify({courses,tasks,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='星学伴Pro学习数据.json';a.click();URL.revokeObjectURL(a.href);toast('数据备份已导出')};
$('today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());render();
</script></body></html>
